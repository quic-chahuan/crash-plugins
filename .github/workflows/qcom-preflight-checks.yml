name: QC Preflight Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Run QC Preflight Checks
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@v2
    with:
      enable-semgrep-scan: true
      # Temporary exemptions for false positives tracked in:
      # https://github.com/qualcomm/qcom-reusable-workflows/issues/78
      semgrep-cli-options: >-
        --config auto
        --config reusable-workflows/semgrep_rules/rules.yaml
        --exclude-rule reusable-workflows.semgrep_rules.cxx.rabv.check.array-access-before-allow-bounds-check
        --exclude-rule reusable-workflows.semgrep_rules.cxx.rabv.check.array-access-before-reject-bounds-check
        --exclude-rule reusable-workflows.semgrep_rules.cxx.funcret.gen.non-void-function-no-return
        --exclude-rule reusable-workflows.semgrep_rules.c.division-by-zero.assigned-zero-variable
        --exclude-rule reusable-workflows.semgrep_rules.c.division-by-zero.declared-zero-variable
      enable-dependency-review: true
      enable-repolinter-check: true
      enable-copyright-license-check: true
      enable-commit-email-check: true
      enable-commit-msg-check: false
      enable-armor-checkers: false

    permissions:
      contents: read
      security-events: write
